name: API Odontológica CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api-odonto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api-odonto/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Check required database and JWT secrets
        shell: bash
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          for name in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Run Maven verification
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: ./mvnw --batch-mode clean verify

      - name: Build Docker image
        run: docker build -t api-odonto:${{ github.sha }} .
